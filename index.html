<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>磊伯勞資充電站 ⚡ 靈感後台</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              800: '#0c4a6e',
              900: '#0f172a',
            }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-16">

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Header -->
  <header class="bg-brand-900 text-white shadow-lg sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 sm:py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-brand-900 font-extrabold text-xl shadow-md flex-shrink-0">
          磊
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-extrabold text-lg sm:text-xl tracking-tight text-white">磊伯勞資充電站</h1>
            <span class="bg-amber-400 text-brand-900 text-xs px-2 py-0.5 rounded-full font-bold">靈感後台</span>
          </div>
          <p class="text-xs text-slate-300">每日法規時事掃描與社群發文雙切角庫</p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2 flex-wrap">
        <a id="sheetLinkBtn" href="https://docs.google.com/spreadsheets/d/1KU6fOsUmD9tJ2cAcRv9KbuzObNwazRBhXqITz2nfMJc/edit" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold shadow transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          開啟試算表
        </a>
        <button id="addIdeaBtn" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-brand-900 text-xs font-bold shadow transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          新增靈感
        </button>
        <button id="exportJsonBtn" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium transition-colors border border-slate-700" title="匯出 JSON 備份">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          備份
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-6">

    <!-- KPI Metric Cards -->
    <section class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
      <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider">總靈感數</div>
          <div id="statTotal" class="text-2xl font-black text-brand-900 mt-0.5">24</div>
        </div>
        <div class="w-9 h-9 rounded-lg bg-blue-50 text-brand-600 flex items-center justify-center font-bold text-base">📚</div>
      </div>
      <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <div class="text-xs font-semibold text-amber-600 uppercase tracking-wider">可發布</div>
          <div id="statReady" class="text-2xl font-black text-amber-600 mt-0.5">0</div>
        </div>
        <div class="w-9 h-9 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center font-bold text-base">✨</div>
      </div>
      <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <div class="text-xs font-semibold text-emerald-600 uppercase tracking-wider">已發布</div>
          <div id="statPublished" class="text-2xl font-black text-emerald-600 mt-0.5">0</div>
        </div>
        <div class="w-9 h-9 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold text-base">🚀</div>
      </div>
      <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider">待微調</div>
          <div id="statPending" class="text-2xl font-black text-slate-600 mt-0.5">0</div>
        </div>
        <div class="w-9 h-9 rounded-lg bg-slate-100 text-slate-600 flex items-center justify-center font-bold text-base">✍️</div>
      </div>
    </section>

    <!-- Filters & Search Toolbar -->
    <section class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6 space-y-3">
      <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
        <!-- Search bar -->
        <div class="relative flex-1">
          <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="text" id="searchInput" placeholder="搜尋議題關鍵字、法規、爭點或 Hook..." class="w-full pl-9 pr-4 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all">
        </div>

        <!-- Status Filter -->
        <div class="flex items-center gap-2">
          <label for="statusFilter" class="text-xs text-slate-500 font-semibold whitespace-nowrap">狀態：</label>
          <select id="statusFilter" class="bg-slate-50 border border-slate-200 text-xs font-medium rounded-lg px-2.5 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500">
            <option value="ALL">全部狀態</option>
            <option value="待修改">待修改</option>
            <option value="可發布">可發布</option>
            <option value="已發FB">已發FB</option>
            <option value="已發Threads">已發Threads</option>
            <option value="封存">封存</option>
          </select>
          <button id="resetDataBtn" class="text-xs text-slate-400 hover:text-rose-600 px-2 py-1 transition-colors whitespace-nowrap" title="重置回預設資料">
            重置
          </button>
        </div>
      </div>

      <!-- Category Filter Pills -->
      <div class="flex items-center gap-1.5 overflow-x-auto pb-1 pt-1 text-xs" id="categoryPills">
        <button data-cat="ALL" class="cat-pill px-3 py-1.5 rounded-full font-bold bg-brand-900 text-white transition-all whitespace-nowrap">
          全部議題
        </button>
        <button data-cat="重大爭議" class="cat-pill px-3 py-1.5 rounded-full font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all whitespace-nowrap">
          重大爭議
        </button>
        <button data-cat="薪資加班" class="cat-pill px-3 py-1.5 rounded-full font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all whitespace-nowrap">
          薪資加班
        </button>
        <button data-cat="請假特休" class="cat-pill px-3 py-1.5 rounded-full font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all whitespace-nowrap">
          請假特休
        </button>
        <button data-cat="聘僱離職" class="cat-pill px-3 py-1.5 rounded-full font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all whitespace-nowrap">
          聘僱離職
        </button>
        <button data-cat="職災安全" class="cat-pill px-3 py-1.5 rounded-full font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all whitespace-nowrap">
          職災安全
        </button>
        <button data-cat="政策法遵" class="cat-pill px-3 py-1.5 rounded-full font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all whitespace-nowrap">
          政策法遵
        </button>
      </div>
    </section>

    <!-- Cards Grid -->
    <section id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Dynamic Rendered Cards -->
    </section>

    <!-- Empty State -->
    <div id="emptyState" class="hidden py-16 text-center bg-white rounded-xl border border-slate-200">
      <div class="text-4xl mb-2">🔍</div>
      <h3 class="font-bold text-slate-700 text-base">找不到相符的靈感議題</h3>
      <p class="text-xs text-slate-400 mt-1">請嘗試不同關鍵字或調整篩選條件</p>
    </div>

  </main>

  <!-- Edit / Add Modal -->
  <div id="ideaModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-100 flex flex-col my-auto">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between sticky top-0 bg-white z-10">
        <h3 id="modalTitle" class="font-black text-slate-800 text-lg">編輯發想靈感</h3>
        <button id="modalCloseBtn" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <form id="ideaForm" class="p-5 space-y-4 text-xs">
        <input type="hidden" id="editId">

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block font-bold text-slate-700 mb-1">日期</label>
            <input type="date" id="formDate" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-brand-500">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">議題分類</label>
            <select id="formCategory" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-brand-500">
              <option value="重大爭議">重大爭議</option>
              <option value="薪資加班">薪資加班</option>
              <option value="請假特休">請假特休</option>
              <option value="聘僱離職">聘僱離職</option>
              <option value="職災安全">職災安全</option>
              <option value="政策法遵">政策法遵</option>
            </select>
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">發布狀態</label>
            <select id="formStatus" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-brand-500">
              <option value="待修改">待修改</option>
              <option value="可發布">可發布</option>
              <option value="已發FB">已發FB</option>
              <option value="已發Threads">已發Threads</option>
              <option value="封存">封存</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">議題名稱 (Topic)</label>
          <input type="text" id="formTopic" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-brand-500" placeholder="例如：美光 AI 獲利創新高爆發罷工危機...">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">核心法規 (Labor Law)</label>
          <input type="text" id="formLaw" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-brand-500" placeholder="例如：勞基法第24條、第38條...">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">時事與法令爭點摘要</label>
          <textarea id="formSummary" rows="2" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-brand-500"></textarea>
        </div>

        <!-- Angle A -->
        <div class="p-3 bg-blue-50/60 rounded-xl border border-blue-100 space-y-2">
          <div class="font-black text-brand-900 flex items-center justify-between">
            <span>切角 A（老闆 / 人資視角）</span>
            <input type="text" id="formAngleAAud" placeholder="受眾標籤" class="text-xs px-2 py-0.5 rounded bg-white border border-blue-200 text-brand-700 font-semibold">
          </div>
          <div>
            <label class="block font-bold text-slate-600 mb-0.5">破題 Hook</label>
            <input type="text" id="formAngleAHook" class="w-full px-3 py-1.5 bg-white border border-blue-200 rounded-lg focus:ring-2 focus:ring-brand-500">
          </div>
          <div>
            <label class="block font-bold text-slate-600 mb-0.5">核心觀點與防禦 SOP</label>
            <textarea id="formAngleAContent" rows="2" class="w-full px-3 py-1.5 bg-white border border-blue-200 rounded-lg focus:ring-2 focus:ring-brand-500"></textarea>
          </div>
        </div>

        <!-- Angle B -->
        <div class="p-3 bg-amber-50/60 rounded-xl border border-amber-100 space-y-2">
          <div class="font-black text-amber-900 flex items-center justify-between">
            <span>切角 B（勞工 / Threads 視角）</span>
            <input type="text" id="formAngleBAud" placeholder="受眾標籤" class="text-xs px-2 py-0.5 rounded bg-white border border-amber-200 text-amber-700 font-semibold">
          </div>
          <div>
            <label class="block font-bold text-slate-600 mb-0.5">破題 Hook</label>
            <input type="text" id="formAngleBHook" class="w-full px-3 py-1.5 bg-white border border-amber-200 rounded-lg focus:ring-2 focus:ring-brand-500">
          </div>
          <div>
            <label class="block font-bold text-slate-600 mb-0.5">核心觀點與防禦 SOP</label>
            <textarea id="formAngleBContent" rows="2" class="w-full px-3 py-1.5 bg-white border border-amber-200 rounded-lg focus:ring-2 focus:ring-brand-500"></textarea>
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">修改與發布備註</label>
          <input type="text" id="formNotes" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-brand-500" placeholder="例如：準備本週四發布、已獲客戶共鳴...">
        </div>

        <div class="pt-3 border-t border-slate-100 flex items-center justify-end gap-2">
          <button type="button" id="modalCancelBtn" class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 font-semibold transition-colors">
            取消
          </button>
          <button type="submit" class="px-5 py-2 rounded-lg bg-brand-900 text-white hover:bg-brand-800 font-bold shadow transition-colors">
            儲存靈感
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Initial Database
    const defaultData = [{"id": 1, "date": "2026-10-21", "category": "重大爭議", "topic": "美光 AI 獲利創新高爆發罷工危機——高科技業「分紅機制」與勞資角力", "law": "勞資爭議處理法、勞基法第2條工資定義", "summary": "受惠AI需求大爆發，美光獲利創新高，但工會抗議分紅制度不透明發動爭議行為與罷工投票，要求制度化紅利共享。", "angle_a_aud": "老闆與人資避險", "angle_a_hook": "公司今年大賺幾十億、發了百萬獎金，員工卻要罷工，老闆到底做錯了什麼？", "angle_a_content": "恩惠性勉勵獎金若名目不清易引發工資認定爭端。建議契約明訂績效獎金發放要件與審查裁量權，建立透明溝通避免演變成勞資罷工爭議。", "angle_b_aud": "職場與Threads熱議", "angle_b_hook": "別羨慕科技業年薪 300 萬，你知道「分紅」跟「薪水」在法律上的致命差別嗎？", "angle_b_content": "分紅非經常性給與，底薪偏低會拉低加班費基數、勞保投保薪資與勞退提繳。上班族應審視薪資結構保障自身厚度。", "status": "可發布", "notes": ""}, {"id": 2, "date": "2026-10-21", "category": "政策法遵", "topic": "勞動部修正「勞資會議應行注意事項」——嚴查「幽靈會議」與「代簽紀錄」", "law": "勞動基準法第30條、第32條、第83條", "summary": "勞動部修正注意事項，嚴查定期召開與代表親簽。虛偽會議紀錄一旦失效，四週/八週變形工時與加班同意全數無效。", "angle_a_aud": "企業主止損", "angle_a_hook": "為了省 10 分鐘開會，偽造一份勞資會議紀錄，最後要補發 80 萬加班費，划算嗎？", "angle_a_content": "長年先簽後印被勞檢抓包，變形工時直接打回原形，超過8小時全算加班費。落實每3個月召開親簽會議才是最低防禦成本。", "angle_b_aud": "人資自保", "angle_b_hook": "老闆叫你「去叫員工簽一簽就好」，人資朋友請先看清楚刑法第 215 條業務登載不實。", "angle_b_content": "代簽或偽造勞資會議紀錄涉刑責。善用開會通知、簽到表及會議紀錄完整留存，保護公司也保護承辦人自身。", "status": "可發布", "notes": ""}, {"id": 3, "date": "2026-10-21", "category": "職災安全", "topic": "颱風天出勤通勤費雇主負擔新規——計程車費與通勤職災責任", "law": "天然災害出勤要點、勞基法第59條職災補償", "summary": "颱風停班日要求員工出勤，衍生交通費用（如計程車）雇主應予負擔，且強風豪雨出勤發生意外屬雇主無過失補償責任。", "angle_a_aud": "企業主避險", "angle_a_hook": "颱風天叫員工上班，省了幾百塊計程車費，萬一摔車骨折，你要賠的是 40 個月的原領工資補償。", "angle_a_content": "停班日出勤騎車摔傷屬勞保職災，雇主負無過失補償責任。全額實報實銷計程車資是雇主最便宜的避險保險。", "angle_b_aud": "勞工共鳴", "angle_b_hook": "停班天老闆在群組傳「大家辛苦了，注意安全」，卻沒補上一句「今天車資找公司報銷」。", "angle_b_content": "天然災害勞工有安全退避權，雇主要求出勤應提供安全交通工具或報銷計程車，保留通訊對話確認報銷保障權益。", "status": "待修改", "notes": ""}, {"id": 4, "date": "2026-10-22", "category": "請假特休", "topic": "10 月婚假延長至 14 天新制生效——「第 9 至 14 天工資補助」與離職爭議", "law": "勞工請假規則第2條、勞動部婚假工資補助要點", "summary": "2026年10月1日起婚假由8日延長為14日，第9-14天工資可向勞保局請領補助。新進員工請滿婚假即離職引發雇主熱議。", "angle_a_aud": "雇主合規與請領補助", "angle_a_hook": "新進員工到職第一週說要請 14 天婚假，休完還想走人，老闆除了苦笑還能合法做什麼？", "angle_a_content": "婚假屬法定權利不得約定任職年限限制。老闆應建立核銷流程，請領政府全額補貼之後6天薪資，並訂妥請假憑證與交接流程。", "angle_b_aud": "職場新人共鳴", "angle_b_hook": "10 月起婚假變 14 天，但人資如果跟你說「公司規定試用期不能請」，直接送他一張勞檢單。", "angle_b_content": "勞基法沒有試用期不能請婚假的規定，後6天政府全額補助雇主，備妥結婚證明提早送單即可合法休好休滿。", "status": "可發布", "notes": ""}, {"id": 5, "date": "2026-10-22", "category": "薪資加班", "topic": "下班 LINE 訊息交辦公事——「加班費認定」升級至「職場霸凌線上登錄」", "law": "勞基法第24條、職業安全衛生法、職場霸凌防治準則", "summary": "下班用通訊軟體交辦公事，截圖即推定加班工時；離峰密集疲勞轟炸更涉職場霸凌系統登錄與行政裁罰。", "angle_a_aud": "管理止損", "angle_a_hook": "主管半夜在群組傳一句「明天一早給我」，這 7 個字可能讓公司被追討 5 年加班費外加職場霸凌通報。", "angle_a_content": "建立離線工作與通訊溝通準則，非緊急禁用群組點名或要求即時回覆；緊急交辦則建置工時補登機制避免違法。", "angle_b_aud": "上班族自保", "angle_b_hook": "下班看到老闆或主管的 LINE 訊息，已讀不回到底算不算犯法？", "angle_b_content": "勞動契約不包含私人時間，已讀不回完全合法。若因未回覆遭考績打壓，截圖保留訊息作為違法處分申訴鐵證。", "status": "已發FB", "notes": "反應熱烈，很多HR詢問通訊管理辦法範本"}, {"id": 6, "date": "2026-10-22", "category": "請假特休", "topic": "年底離職與特休結算前哨戰——「曆年制轉週年制」少算一天罰 2 萬", "law": "勞基法第38條第4項、勞基法施行細則第24-1條", "summary": "曆年制屬行政簡便措施，員工離職時依法一律回歸「週年制」結算未休日數工資，若少算短發即屬違反全額給付。", "angle_a_aud": "人資會計系統合規", "angle_a_hook": "為了年底做帳方便用曆年制，員工一離職少算半天特休，公司直接被罰 2 萬，你的 Excel 算對了嗎？", "angle_a_content": "離職必須還原到職日起算之法定週年制天數，兩者取其高補足差額。系統應內建轉換模組，由員工簽認結算清冊避險。", "angle_b_aud": "離職權益自保", "angle_b_hook": "提離職時人資跟你說「特休依比例只能休到今天」，先別急著簽字，你很可能被偷走好幾天薪水。", "angle_b_content": "滿半年3天、滿1年7天是法定整包權利，離職不得打折扣除。利用勞動部試算系統核對，差額全額折現請求。", "status": "可發布", "notes": ""}, {"id": 7, "date": "2026-10-23", "category": "職災安全", "topic": "勞動部發布「旅宿業中高齡就業指引」——缺工解方背後的「退休再就業投保」地雷", "law": "勞工職業災害保險及保護法、勞基法第59條", "summary": "勞動部發布中高齡就業指引推動工作拆解。但進用已退休人員，雇主仍強制加保職災保險，否則職災補償全額自負。", "angle_a_aud": "旅宿餐飲雇主避險", "angle_a_hook": "請退休大哥大姐來兼職，每個月省下 60 塊職災保險費，員工滑倒骨折，你要自己賠 30 萬。", "angle_a_content": "已領勞保給付人員雖免普通勞保，但職保為強制投保。每月幾十元保費轉嫁巨額職災醫療工資補償風險。", "angle_b_aud": "高齡二度就業", "angle_b_hook": "退休後想去飯店兼職打工賺零用錢，老闆跟你說「因為你退休了所以不用加保」，請馬上轉身就走。", "angle_b_content": "退休再就業一樣享有職災保險保障。確認到職第一天加保職保，避免工作意外求償無門。", "status": "待修改", "notes": ""}, {"id": 8, "date": "2026-10-23", "category": "聘僱離職", "topic": "離職「競業禁止條款」沒給補償金——《勞基法》第 9-1 條「直接形同白紙」", "law": "勞動基準法第9條之1、勞基法施行細則第7-3條", "summary": "約定離職後競業禁止，雇主未每月給予不低於平均工資50%之合理補償，約定自始無效。", "angle_a_aud": "企業主止損", "angle_a_hook": "拿網路抓的競業禁止合約叫員工簽，一毛補償金都不給，你以為綁住了人才，在法官眼裡那只是一張廢紙。", "angle_a_content": "核心人才簽競業禁止並依法編列50%補償預算；一般員工強化營業秘密法NDA與智慧財產權歸屬，才是高防禦且零違法成本做法。", "angle_b_aud": "轉職求職者", "angle_b_hook": "離職時主管嗆你「你簽過競業禁止，敢去對手公司我就告死你」，你只要回他一句話他就閉嘴了。", "angle_b_content": "詢問公司離職後是否按月匯入半薪補償金。若未給補償金，條款自始無效，不必受恐嚇信威脅。", "status": "已發Threads", "notes": "Threads破百讚"}, {"id": 9, "date": "2026-10-23", "category": "聘僱離職", "topic": "外送專法規範效應蔓延——連鎖餐飲「假承攬真外送」的勞檢追索風暴", "law": "外送員權益保障及平臺管理法、勞動基準法僱傭認定", "summary": "外送專法上路後，餐飲自招外送員簽承攬合約，但若受指揮監督、排班穿制服，勞檢直接認定為僱傭追繳勞退加班費。", "angle_a_aud": "餐飲零售老闆", "angle_a_hook": "嫌外送平台抽成高，自己找外送員簽「論件計酬承攬合約」？勞檢一進門，補稅加罰款保證比抽成貴 10 倍。", "angle_a_content": "只要管時間、管服裝、指派單量即具從屬性。自聘外送員應採部分工時僱傭，依法投保並提供防護設施，避免假承攬重罰。", "angle_b_aud": "外送兼職從業人員", "angle_b_hook": "幫便當店跑外送，老闆說「你是接案承攬沒有勞健保」，但排班請假都要他批准？恭喜你，你其實是正職員工待遇的受害者。", "angle_b_content": "保留排班表、對話紀錄與送單打卡。具備從屬性即可向勞檢申訴補繳勞保年資與追討勞退 6%。", "status": "待修改", "notes": ""}, {"id": 10, "date": "2026-10-24", "category": "聘僱離職", "topic": "試用期不適任「當天叫員工走人」——非法解僱與資遣費地雷", "law": "勞基法第11條第5款、第16條、第17條", "summary": "勞基法無試用期豁免條款。終止契約仍須具備法定事由，給付資遣費並開立非自願離職證明，強逼自請離職易成非法解僱。", "angle_a_aud": "雇主用人避險", "angle_a_hook": "覺得試用期新人不行，當天叫他收桌子走人，幾個月後你可能要掏出 30 萬補發他沒上班期間的工資。", "angle_a_content": "建立第30天/60天考核面談紀錄，不適任依法資遣、申報通報並開非自願離職證明，花幾千元資遣費買斷巨額爭議風險。", "angle_b_aud": "職場求職者自保", "angle_b_hook": "試用期最後一天主管把你叫進會議室，遞一張「自請離職單」要你簽，請把雙手插進口袋絕對別碰筆。", "angle_b_content": "公司認定不適任應開立非自願離職證明發給資遣費，以利申請6個月失業給付。切勿自簽離職放棄權益。", "status": "可發布", "notes": ""}, {"id": 11, "date": "2026-10-24", "category": "薪資加班", "topic": "假調職真逼退——《勞基法》第 10-1 條「調動五原則」與隱形減薪", "law": "勞動基準法第10條之1、第14條第1項第6款", "summary": "調職調外縣市、扣除職務加給或片面減薪，均違反調動五原則。勞工得不經預告終止契約並索討資遣費。", "angle_a_aud": "管理止損", "angle_a_hook": "想逼走看不順眼的員工，把他從總部調去物流倉庫還順便砍薪 3,000，結果隔天收到存證信函要資遣費。", "angle_a_content": "調動不得作不利變更，動薪水或未補貼交通成本即屬違法。調職前應取得合意並給予通勤或住宿協助。", "angle_b_aud": "上班族抗辯權益", "angle_b_hook": "明天突然被通知「下週調去外縣市分公司，薪水還要少五千」，千萬別默默吞下去。", "angle_b_content": "片面減薪與過度調動可書面拒絕，雇主強行調動可依勞基法第14條要求資遣費離職。", "status": "可發布", "notes": ""}, {"id": 12, "date": "2026-10-24", "category": "薪資加班", "topic": "病假全勤獎金「全扣」已違法——勞工請假規則新修訂與工資全額給付原則", "law": "勞工請假規則第9條第2項、勞基法第22條第2項", "summary": "新修訂勞工請假規則明訂普通傷病假扣全勤僅得按請假日數依比例扣發，請1天病假扣光全額直接觸犯工資未全額給付。", "angle_a_aud": "人資薪資計算合規", "angle_a_hook": "員工感冒請 1 天病假，你扣他整個月 3,000 塊全勤，勞檢進門第一張罰單就是 2 萬起跳。", "angle_a_content": "全勤為工資對價，扣發公式必須改為依30天按比例折算，或重整薪資結構降低全勤佔比避免罰鍰。", "angle_b_aud": "上班族反剝削", "angle_b_hook": "發燒到 39 度還是不敢請病假，因為請一天假直接被扣 3,000 塊全勤？老闆其實已經違法了。", "angle_b_content": "病假扣全勤依法僅能扣當日比例，多扣屬非法苛扣工資，可依法追溯5年請求返還溢扣差額。", "status": "可發布", "notes": ""}, {"id": 13, "date": "2026-10-25", "category": "薪資加班", "topic": "下班沒走待在辦公室——《勞動事件法》第 38 條「工時推定」核彈級地雷", "law": "勞動事件法第38條、勞動基準法第24條", "summary": "出勤紀錄登載時間法律推定為經雇主同意提供勞務。即使有申請制，雇主無具體反證即需補發巨額加班費。", "angle_a_aud": "雇主出勤管理避險", "angle_a_hook": "公司規章寫了「加班一律要申請」，員工下班留在辦公室吹冷氣，離職後卻能合法討走 40 萬加班費？", "angle_a_content": "建立異常逗留核銷阻斷機制，逗留超過30分鐘隔日發信確認是否私事，落實準時關燈閉門排除灰色工時。", "angle_b_aud": "上班族血汗加班爭取", "angle_b_hook": "每天被迫在辦公室無償加班到 8 點，主管還說「你自己手腳慢沒填申請不算加班」，教你用打卡紀錄合法討回血汗錢。", "angle_b_content": "打卡時間依法推定為工時，備妥通訊工作對話與刷卡紀錄，離職5年內皆能合法追討加班費。", "status": "可發布", "notes": ""}, {"id": 14, "date": "2026-10-25", "category": "聘僱離職", "topic": "員工離職沒提前說——老闆氣到「扣薪抵交接」反而吃上百萬罰單", "law": "勞基法第16條、第22條第2項、第26條", "summary": "未達離職預告期，雇主不得私自預扣工資作為違約賠償或扣留服務證明書，否則重罰2萬至100萬元。", "angle_a_aud": "雇主止損情緒管理", "angle_a_hook": "員工提離職說走就走、交接擺爛，老闆一氣之下扣他 5,000 塊薪水，結果隔週勞檢登門開罰 9 萬。", "angle_a_content": "薪資依法全額直接給付，營業損失另循民事請求。平常建立崗位SOP交接雲端化，避免情緒扣薪引火上身。", "angle_b_aud": "離職勞工權益", "angle_b_hook": "提離職時老闆放話「預告期不夠，最後一個月薪水你一毛都別想拿」，別害怕，這句話值 2 萬到 100 萬罰鍰。", "angle_b_content": "勞基法無未預告行政罰則，出勤工資一毛不能少。遭遇扣薪立即申請勞資調解索回全額。", "status": "待修改", "notes": ""}, {"id": 15, "date": "2026-10-25", "category": "請假特休", "topic": "育嬰留停「以日申請」新制上路——排班調度焦慮 vs 雇主千元獎勵金", "law": "性別平等工作法第16條、第21條、雇主替代人力獎勵辦法", "summary": "彈性育嬰留停開放按日申請（上限30日）領8成薪。雇主不得拒絕，但可申領每日最高1,000元代班排班獎勵金。", "angle_a_aud": "人資排班與補助領取", "angle_a_hook": "員工突然請 1 天育嬰假，主管氣得想拒絕？小心踩到性別平等工作法，其實政府每天補貼你 1,000 塊找代班！", "angle_a_content": "制定彈性育嬰假提前申請指引，並建立替代兼職人才庫，同步申請政府每日千元津貼化解排班人力荒。", "angle_b_aud": "雙薪家庭職場爸媽", "angle_b_hook": "小孩腸病毒停課一週，不用再拿自己的特休或事假硬撐，育嬰假現在可以「請單天」而且還有 8 成薪！", "angle_b_content": "不用一次請半年，單日育嬰留停搭配8成薪津貼，備妥戶籍證明提前送單兼顧家庭與考績。", "status": "可發布", "notes": ""}, {"id": 16, "date": "2026-10-26", "category": "請假特休", "topic": "年底特休「老闆強制指定排休」——《勞基法》第 38 條第 2 項排定權專屬勞工", "law": "勞基法第38條第2項、第79條", "summary": "特休排定權專屬勞工，雇主僅得提醒促請。公告全體統一排休或強制劃休，違者重罰2萬至100萬元。", "angle_a_aud": "老闆排假止損", "angle_a_hook": "公告「週五全公司統一休特休」，以為替公司省下年底折現成本，結果勞檢登門開罰 50 萬。", "angle_a_content": "強制指定排休侵犯勞工排定權。正解為定期系統提醒未休假，協商個別同意或於年底全額依法折發現金。", "angle_b_aud": "上班族假期捍衛", "angle_b_hook": "公司公告「特休年底沒休完直接統一排休」，請截圖存檔，這叫公然違反勞基法第 38 條。", "angle_b_content": "特休哪天放自己決定，拒絕強制排休。到期沒休完每一天都能換回白花花工資。", "status": "可發布", "notes": ""}, {"id": 17, "date": "2026-10-26", "category": "薪資加班", "topic": "加班換補休「到期未休完直接歸零」——《勞基法》第 32-1 條違法欠薪陷阱", "law": "勞基法第32條之1第2項、第24條加班費", "summary": "補休逾期或離職未休畢，雇主必須還原依加班當日工資率（1.34/1.67倍）折發加班費，直接歸零屬違法欠薪。", "angle_a_aud": "人資會計系統合規", "angle_a_hook": "系統設定「補休滿一年自動失效清零」，這個偷懶設定，就是讓公司吃上欠薪罪名的現行犯。", "angle_a_content": "補休本質是延期支付工資。系統屆期必須自動以加班當日倍率（1.34/1.67）計算轉發工資，嚴禁清空。", "angle_b_aud": "加班族討公道", "angle_b_hook": "辛辛苦苦加班累積了 40 個小時補休，年底人資跟你說「過期歸零囉」，別客氣直接拿法條要錢。", "angle_b_content": "沒有任何加班能被憑空抹去，截圖備份補休時數，到期要求還原加班費折現。", "status": "可發布", "notes": ""}, {"id": 18, "date": "2026-10-26", "category": "政策法遵", "topic": "《就業服務法》薪資揭露門檻擬調高至 5 萬元——告別「薪資面議」攬才黑盒子", "law": "就業服務法第5條第2項第6款", "summary": "薪資揭露門檻擬從4萬調高至5萬，低於5萬禁止面議且級距不可過寬，違者開罰6萬至30萬元。", "angle_a_aud": "雇主雇主品牌招募", "angle_a_hook": "徵才廣告寫「面議」，面試才開 3 萬 5，以後不只招不到好人才，還要先吞 6 萬元就業服務法罰單。", "angle_a_content": "透明標示薪資區間（差距宜於1-1.5萬內）建立誠信雇主品牌，避免虛偽區間遭求職者檢舉挨罰。", "angle_b_aud": "求職者面試避雷", "angle_b_hook": "請假半天跑去面試寫著「薪資面議」的工作，談到最後對方開 3 萬 2，這種公司真的可以直接拉黑。", "angle_b_content": "面議門檻拉高有助過濾假高薪職缺，投履歷確認具體待遇區間，拒絕無效面試浪費時間。", "status": "待修改", "notes": ""}, {"id": 19, "date": "2026-10-27", "category": "聘僱離職", "topic": "勞動部通令嚴查「最低服務年限綁     // Toast Notification helper
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `px-4 py-2.5 rounded-xl text-xs font-bold shadow-xl border flex items-center gap-2 transform transition-all duration-300 pointer-events-auto ${
        type === 'success' 
          ? 'bg-slate-900 text-white border-slate-700' 
          : 'bg-rose-600 text-white border-rose-500'
      }`;
      toast.innerHTML = `<span>${type === 'success' ? '⚡' : '⚠️'}</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px)';
        setTimeout(() => toast.remove(), 300);
      }, 2400);
    }

    // Copy to clipboard with fallback
    function copyText(text, toastMsg = '已複製到剪貼簿！') {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(toastMsg);
        }).catch(() => {
          fallbackCopy(text, toastMsg);
        });
      } else {
        fallbackCopy(text, toastMsg);
      }
    }

    function fallbackCopy(text, toastMsg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        showToast(toastMsg);
      } catch (err) {
        showToast('複製失敗，請手動選取複製', 'error');
      }
      ta.remove();
    }

    // Status Badge Color Map
    const statusColors = {
      '待修改': 'bg-slate-100 text-slate-700 border-slate-300',
      '可發布': 'bg-amber-50 text-amber-700 border-amber-300',
      '已發FB': 'bg-blue-50 text-blue-700 border-blue-300',
      '已發Threads': 'bg-purple-50 text-purple-700 border-purple-300',
      '封存': 'bg-gray-100 text-gray-500 border-gray-200'
    };

    // Category Badge Color Map
    const categoryColors = {
      '重大爭議': 'bg-rose-50 text-rose-700 border-rose-200',
      '薪資加班': 'bg-emerald-50 text-emerald-700 border-emerald-200',
      '請假特休': 'bg-cyan-50 text-cyan-700 border-cyan-200',
      '聘僱離職': 'bg-indigo-50 text-indigo-700 border-indigo-200',
      '職災安全': 'bg-amber-50 text-amber-700 border-amber-200',
      '政策法遵': 'bg-sky-50 text-sky-700 border-sky-200'
    };

    // Update Top Metric Counters
    function updateStats() {
      document.getElementById('statTotal').textContent = ideas.length;
      document.getElementById('statReady').textContent = ideas.filter(i => i.status === '可發布').length;
      document.getElementById('statPublished').textContent = ideas.filter(i => i.status === '已發FB' || i.status === '已發Threads').length;
      document.getElementById('statPending').textContent = ideas.filter(i => i.status === '待修改').length;
    }

    // Filter state
    let currentCategory = 'ALL';
    let currentStatus = 'ALL';
    let currentSearch = '';

    // Render Cards
    function renderCards() {
      const container = document.getElementById('cardsContainer');
      const emptyState = document.getElementById('emptyState');
      container.innerHTML = '';

      const filtered = ideas.filter(item => {
        const matchCat = (currentCategory === 'ALL' || item.category === currentCategory);
        const matchStatus = (currentStatus === 'ALL' || item.status === currentStatus);
        const searchTarget = `${item.topic} ${item.law} ${item.summary} ${item.angle_a_hook} ${item.angle_a_content} ${item.angle_b_hook} ${item.angle_b_content}`.toLowerCase();
        const matchSearch = (!currentSearch || searchTarget.includes(currentSearch.toLowerCase()));
        return matchCat && matchStatus && matchSearch;
      });

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
      }

      // Sort newest date first
      filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl border border-slate-200/90 shadow-sm hover:shadow-md transition-shadow flex flex-col p-4 sm:p-5 relative overflow-hidden group";

        const catColor = categoryColors[item.category] || 'bg-slate-50 text-slate-700 border-slate-200';
        const stColor = statusColors[item.status] || 'bg-slate-50 text-slate-700 border-slate-200';

        card.innerHTML = `
          <!-- Top metadata row -->
          <div class="flex items-center justify-between gap-2 mb-2.5">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-xs font-mono font-bold text-slate-500">${item.date}</span>
              <span class="text-[11px] px-2 py-0.5 rounded-full font-bold border ${catColor}">
                ${item.category}
              </span>
            </div>

            <!-- Status selector -->
            <select class="status-select text-[11px] font-bold px-2 py-1 rounded-lg border ${stColor} bg-white cursor-pointer focus:outline-none focus:ring-1 focus:ring-brand-500" data-id="${item.id}">
              <option value="待修改" ${item.status === '待修改' ? 'selected' : ''}>待修改</option>
              <option value="可發布" ${item.status === '可發布' ? 'selected' : ''}>可發布</option>
              <option value="已發FB" ${item.status === '已發FB' ? 'selected' : ''}>已發FB</option>
              <option value="已發Threads" ${item.status === '已發Threads' ? 'selected' : ''}>已發Threads</option>
              <option value="封存" ${item.status === '封存' ? 'selected' : ''}>封存</option>
            </select>
          </div>

          <!-- Title -->
          <h2 class="font-extrabold text-slate-900 text-sm sm:text-base leading-snug mb-2 group-hover:text-brand-700 transition-colors">
            ${item.topic}
          </h2>

          <!-- Law & Summary -->
          <div class="bg-slate-50 rounded-xl p-3 border border-slate-100 mb-3 text-xs space-y-1">
            <div class="flex items-center gap-1 text-brand-700 font-bold">
              <span>⚖️</span>
              <span>${item.law}</span>
            </div>
            <p class="text-slate-600 leading-relaxed text-[11px]">${item.summary}</p>
          </div>

          <!-- Dual Angles Section -->
          <div class="space-y-2.5 flex-1 mb-3">

            <!-- Angle A: Employer/HR -->
            <div class="rounded-xl border border-blue-100 bg-gradient-to-br from-blue-50/50 to-white p-3 text-xs relative group/a">
              <div class="flex items-center justify-between gap-2 mb-1">
                <span class="font-black text-brand-900 flex items-center gap-1">
                  <span class="w-2 h-2 rounded-full bg-brand-600"></span>
                  切角 A（${item.angle_a_aud || '老闆/人資避險'}）
                </span>
                <button class="copy-hook-a text-[11px] text-brand-600 hover:text-brand-800 font-semibold px-2 py-0.5 rounded bg-white border border-blue-200 hover:bg-blue-50 transition-colors shadow-2xs" data-id="${item.id}">
                  複製 Hook
                </button>
              </div>
              <p class="font-bold text-slate-800 text-[12px] leading-relaxed mb-1">
                「${item.angle_a_hook}」
              </p>
              <p class="text-slate-600 text-[11px] leading-relaxed">
                ${item.angle_a_content}
              </p>
            </div>

            <!-- Angle B: Employee/Threads -->
            <div class="rounded-xl border border-amber-100 bg-gradient-to-br from-amber-50/50 to-white p-3 text-xs relative group/b">
              <div class="flex items-center justify-between gap-2 mb-1">
                <span class="font-black text-amber-900 flex items-center gap-1">
                  <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                  切角 B（${item.angle_b_aud || '上班族/Threads'}）
                </span>
                <button class="copy-hook-b text-[11px] text-amber-700 hover:text-amber-900 font-semibold px-2 py-0.5 rounded bg-white border border-amber-200 hover:bg-amber-50 transition-colors shadow-2xs" data-id="${item.id}">
                  複製 Hook
                </button>
              </div>
              <p class="font-bold text-slate-800 text-[12px] leading-relaxed mb-1">
                「${item.angle_b_hook}」
              </p>
              <p class="text-slate-600 text-[11px] leading-relaxed">
                ${item.angle_b_content}
              </p>
            </div>

          </div>

          <!-- Notes if any -->
          ${item.notes ? `
          <div class="text-[11px] text-amber-800 bg-amber-50/60 border border-amber-200/50 px-2.5 py-1.5 rounded-lg mb-3 flex items-center gap-1">
            <span>📝</span>
            <span class="truncate">${item.notes}</span>
          </div>` : ''}

          <!-- Footer Action Bar -->
          <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2 mt-auto text-xs">
            <div class="flex items-center gap-1">
              <button class="edit-btn p-1.5 text-slate-400 hover:text-brand-700 hover:bg-slate-100 rounded-lg transition-colors" data-id="${item.id}" title="編輯內容">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
              </button>
              <button class="delete-btn p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors" data-id="${item.id}" title="刪除靈感">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </div>

            <button class="copy-all-btn inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-brand-800 text-white font-bold text-xs transition-colors shadow-sm" data-id="${item.id}">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
              一鍵全選複製
            </button>
          </div>
        `;

        container.appendChild(card);
      });

      attachCardListeners();
    }

    function attachCardListeners() {
      document.querySelectorAll('.status-select').forEach(sel => {
        sel.addEventListener('change', (e) => {
          const id = parseInt(e.target.dataset.id);
          const item = ideas.find(i => i.id === id);
          if (item) {
            item.status = e.target.value;
            saveIdeas();
            showToast(`已將狀態變更為「${item.status}」`);
          }
        });
      });

      document.querySelectorAll('.copy-hook-a').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = parseInt(e.currentTarget.dataset.id);
          const item = ideas.find(i => i.id === id);
          if (item) copyText(item.angle_a_hook, '已複製 切角 A 破題 Hook！');
        });
      });

      document.querySelectorAll('.copy-hook-b').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = parseInt(e.currentTarget.dataset.id);
          const item = ideas.find(i => i.id === id);
          if (item) copyText(item.angle_b_hook, '已複製 切角 B 破題 Hook！');
        });
      });

      document.querySelectorAll('.copy-all-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = parseInt(e.currentTarget.dataset.id);
          const item = ideas.find(i => i.id === id);
          if (item) {
            const formatted = `【${item.topic}】\n` +
              `📅 日期：${item.date}｜分類：${item.category}\n` +
              `⚖️ 核心法規：${item.law}\n` +
              `📌 爭點摘要：${item.summary}\n\n` +
              `👉 切角 A（${item.angle_a_aud}）：\n` +
              `【Hook】${item.angle_a_hook}\n` +
              `【觀點】${item.angle_a_content}\n\n` +
              `👉 切角 B（${item.angle_b_aud}）：\n` +
              `【Hook】${item.angle_b_hook}\n` +
              `【觀點】${item.angle_b_content}`;
            copyText(formatted, '已複製完整發想內容！');
          }
        });
      });

      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = parseInt(e.currentTarget.dataset.id);
          openEditModal(id);
        });
      });

      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = parseInt(e.currentTarget.dataset.id);
          deleteIdea(id);
        });
      });
    }

    // Modal Control
    const modal = document.getElementById('ideaModal');
    const form = document.getElementById('ideaForm');

    function openAddModal() {
      document.getElementById('modalTitle').textContent = '新增發想靈感';
      form.reset();
      document.getElementById('editId').value = '';
      document.getElementById('formDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('formStatus').value = '可發布';
      modal.classList.remove('hidden');
    }

    function openEditModal(id) {
      const item = ideas.find(i => i.id === id);
      if (!item) return;
      document.getElementById('modalTitle').textContent = '編輯發想靈感';
      document.getElementById('editId').value = item.id;
      document.getElementById('formDate').value = item.date;
      document.getElementById('formCategory').value = item.category;
      document.getElementById('formStatus').value = item.status;
      document.getElementById('formTopic').value = item.topic;
      document.getElementById('formLaw').value = item.law;
      document.getElementById('formSummary').value = item.summary;
      document.getElementById('formAngleAAud').value = item.angle_a_aud;
      document.getElementById('formAngleAHook').value = item.angle_a_hook;
      document.getElementById('formAngleAContent').value = item.angle_a_content;
      document.getElementById('formAngleBAud').value = item.angle_b_aud;
      document.getElementById('formAngleBHook').value = item.angle_b_hook;
      document.getElementById('formAngleBContent').value = item.angle_b_content;
      document.getElementById('formNotes').value = item.notes || '';
      modal.classList.remove('hidden');
    }

    function closeModal() {
      modal.classList.add('hidden');
    }

    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
    document.getElementById('addIdeaBtn').addEventListener('click', openAddModal);

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const editId = document.getElementById('editId').value;
      const payload = {
        date: document.getElementById('formDate').value,
        category: document.getElementById('formCategory').value,
        status: document.getElementById('formStatus').value,
        topic: document.getElementById('formTopic').value,
        law: document.getElementById('formLaw').value,
        summary: document.getElementById('formSummary').value,
        angle_a_aud: document.getElementById('formAngleAAud').value || '老闆/人資避險',
        angle_a_hook: document.getElementById('formAngleAHook').value,
        angle_a_content: document.getElementById('formAngleAContent').value,
        angle_b_aud: document.getElementById('formAngleBAud').value || '上班族/Threads',
        angle_b_hook: document.getElementById('formAngleBHook').value,
        angle_b_content: document.getElementById('formAngleBContent').value,
        notes: document.getElementById('formNotes').value
      };

      if (editId) {
        const id = parseInt(editId);
        const idx = ideas.findIndex(i => i.id === id);
        if (idx !== -1) {
          ideas[idx] = { ...ideas[idx], ...payload };
          showToast('靈感已成功更新！');
        }
      } else {
        const newId = ideas.length > 0 ? Math.max(...ideas.map(i => i.id)) + 1 : 1;
        ideas.unshift({ id: newId, ...payload });
        showToast('已新增一則新靈感！');
      }

      saveIdeas();
      closeModal();
    });

    function deleteIdea(id) {
      const idx = ideas.findIndex(i => i.id === id);
      if (idx !== -1) {
        ideas.splice(idx, 1);
        saveIdeas();
        showToast('已移除該則靈感');
      }
    }

    // Category Pill Filters
    document.querySelectorAll('.cat-pill').forEach(pill => {
      pill.addEventListener('click', (e) => {
        document.querySelectorAll('.cat-pill').forEach(p => {
          p.classList.remove('bg-brand-900', 'text-white', 'font-bold');
          p.classList.add('bg-slate-100', 'text-slate-600', 'font-medium');
        });
        e.currentTarget.classList.remove('bg-slate-100', 'text-slate-600', 'font-medium');
        e.currentTarget.classList.add('bg-brand-900', 'text-white', 'font-bold');

        currentCategory = e.currentTarget.dataset.cat;
        renderCards();
      });
    });

    // Status Filter
    document.getElementById('statusFilter').addEventListener('change', (e) => {
      currentStatus = e.target.value;
      renderCards();
    });

    // Search Input
    document.getElementById('searchInput').addEventListener('input', (e) => {
      currentSearch = e.target.value.trim();
      renderCards();
    });

    // Export JSON backup
    document.getElementById('exportJsonBtn').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(ideas, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `leibo_ideas_backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast('已下載 JSON 備份檔！');
    });

    // Reset Data
    document.getElementById('resetDataBtn').addEventListener('click', () => {
      ideas = [...defaultData];
      saveIdeas();
      showToast('已恢復預設靈感資料庫');
    });

    // Initial render
    updateStats();
    renderCards();
  </script>
</body>
</html>
