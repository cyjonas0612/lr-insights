<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LR INSIGHTS ⚡ 磊伯勞資充電站靈感後台</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
          },
          colors: {
            brand: {
              navy: '#0f172a',
              card: '#1e293b',
              accent: '#f59e0b',
              accentHover: '#d97706',
              border: '#334155'
            }
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    body {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-16 antialiased selection:bg-amber-500 selection:text-slate-900">

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-5 right-5 z-50 transform transition-all duration-300 translate-y-[-120%] opacity-0 pointer-events-none flex items-center gap-2 bg-slate-900 border border-amber-500/50 shadow-2xl shadow-amber-500/10 text-amber-300 px-4 py-3 rounded-xl text-sm font-medium backdrop-blur-md">
    <span id="toastIcon">⚡</span>
    <span id="toastMsg">通知內容</span>
  </div>

  <!-- Sticky Header -->
  <header class="sticky top-0 z-40 bg-slate-950/85 backdrop-blur-md border-b border-slate-800 px-3.5 py-3 sm:px-6">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-2 sm:gap-3">
      <!-- 品牌識別 -->
      <div class="flex items-center gap-2 sm:gap-3 flex-shrink-0">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center shadow-lg shadow-amber-500/20 text-slate-950 font-black text-lg sm:text-xl flex-shrink-0">
          磊
        </div>
        <div>
          <h1 class="text-sm sm:text-lg font-bold tracking-tight text-white flex items-center gap-1.5">
            LR INSIGHTS <span class="text-amber-400 text-[10px] sm:text-xs px-1.5 sm:px-2 py-0.5 rounded-full bg-amber-500/10 border border-amber-500/30">雲端連線</span>
          </h1>
          <p class="text-[10px] sm:text-xs text-slate-400">磊伯勞資充電站 ⚡ 靈感後台</p>
        </div>
      </div>

      <!-- 操作按鈕群 -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <!-- 開啟試算表按鈕 -->
        <a href="https://docs.google.com/spreadsheets/d/1KU6fOsUmD9tJ2cAcRv9KbuzObNwazRBhXqITz2nfMJc/edit" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-md shadow-emerald-900/30 border border-emerald-400/40 transition flex-shrink-0">
          <svg class="w-3.5 h-3.5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H6v-2h3v2zm0-4H6v-2h3v2zm0-4H6V7h3v2zm10 8h-8v-2h8v2zm0-4h-8v-2h8v2zm0-4h-8V7h8v2z"/></svg>
          <span>開啟試算表</span>
        </a>

        <!-- 同步試算表按鈕 -->
        <button onclick="fetchSheetData(true)" class="inline-flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 text-xs font-semibold shadow-sm transition" title="重新自試算表抓取最新資料">
          <svg id="syncIcon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          <span class="hidden sm:inline">同步更新</span>
        </button>

        <!-- 備份 JSON 按鈕 -->
        <button onclick="exportJSONBackup()" class="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium border border-slate-700 transition" title="備份 JSON">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          <span>備份</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-5">
    <!-- Metric Dashboard (KPI 數據看板) -->
    <section class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 mb-5">
      <div class="bg-slate-900/90 border border-slate-800 p-3.5 rounded-2xl shadow-sm">
        <span class="text-xs text-slate-400 font-medium">總靈感庫存</span>
        <div class="mt-1 flex items-baseline justify-between">
          <span id="metricTotal" class="text-2xl font-black text-white">0</span>
          <span class="text-[10px] text-slate-500">則</span>
        </div>
      </div>
      <div class="bg-slate-900/90 border border-slate-800 p-3.5 rounded-2xl shadow-sm">
        <span class="text-xs text-emerald-400 font-medium">可發布</span>
        <div class="mt-1 flex items-baseline justify-between">
          <span id="metricReady" class="text-2xl font-black text-emerald-400">0</span>
          <span class="text-[10px] text-emerald-500/60">可直接用</span>
        </div>
      </div>
      <div class="bg-slate-900/90 border border-slate-800 p-3.5 rounded-2xl shadow-sm">
        <span class="text-xs text-blue-400 font-medium">已發布</span>
        <div class="mt-1 flex items-baseline justify-between">
          <span id="metricPublished" class="text-2xl font-black text-blue-400">0</span>
          <span class="text-[10px] text-blue-500/60">FB / Threads</span>
        </div>
      </div>
      <div class="bg-slate-900/90 border border-slate-800 p-3.5 rounded-2xl shadow-sm">
        <span class="text-xs text-amber-400 font-medium">待修改</span>
        <div class="mt-1 flex items-baseline justify-between">
          <span id="metricDraft" class="text-2xl font-black text-amber-400">0</span>
          <span class="text-[10px] text-amber-500/60">調整中</span>
        </div>
      </div>
    </section>

    <!-- Toolbar & Filters (大漏斗 + 精準文章選取器) -->
    <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 mb-6 shadow-sm space-y-3.5">
      <!-- 精準取用器：文章專屬快速選取下拉選單 -->
      <div class="bg-slate-950/80 border border-amber-500/30 rounded-xl p-2.5 sm:p-3 flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
        <div class="flex items-center gap-1.5 text-xs font-bold text-amber-400 flex-shrink-0">
          <span>🎯</span>
          <span>指定文章：</span>
        </div>
        <div class="relative flex-1">
          <select id="articleSelect" onchange="handleArticleSelect(this.value)" class="w-full bg-slate-900 border border-slate-700/80 text-xs sm:text-sm text-slate-100 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-400 transition font-medium">
            <option value="ALL">📋 顯示當前全部文章清單</option>
          </select>
        </div>
        <div class="flex items-center justify-between sm:justify-end gap-2 flex-shrink-0">
          <button id="resetFocusBtn" onclick="resetFocusMode()" class="hidden text-xs text-slate-400 hover:text-white px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 transition">
            返回全部列表
          </button>
          <span id="articleCountBadge" class="text-[11px] text-slate-400 font-mono px-2 py-1 rounded bg-slate-900 border border-slate-800">
            共 0 則
          </span>
        </div>
      </div>

      <!-- 漏斗第一層：搜尋與狀態篩選 -->
      <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
        <div class="relative flex-1">
          <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="搜尋議題標題、爭點、切角 Hook、觀點或防禦SOP..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-xs sm:text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
        </div>
        
        <div class="flex items-center gap-2">
          <select id="statusFilter" onchange="handleStatusFilter(this.value)" class="bg-slate-950 border border-slate-800 text-xs sm:text-sm text-slate-300 rounded-xl px-3 py-2 focus:outline-none focus:border-amber-500 transition">
            <option value="ALL">全部狀態</option>
            <option value="可發布">可發布</option>
            <option value="待修改">待修改</option>
            <option value="已發FB">已發FB</option>
            <option value="已發Threads">已發Threads</option>
            <option value="封存">封存</option>
          </select>
          <span id="lastSyncTime" class="text-[11px] text-slate-500 font-mono whitespace-nowrap hidden sm:inline">讀取中...</span>
        </div>
      </div>

      <!-- 漏斗第二層：分類標籤滑動列 -->
      <div id="categoryPills" class="flex items-center gap-2 overflow-x-auto no-scrollbar pt-1 pb-0.5">
        <button onclick="handleCategoryFilter('ALL')" data-cat="ALL" class="cat-pill active px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap border transition bg-amber-500 border-amber-500 text-slate-950 shadow-sm">
          全部議題
        </button>
      </div>
    </section>

    <!-- Loading State -->
    <div id="loadingState" class="py-20 text-center">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-amber-400 mb-3"></div>
      <p class="text-sm text-slate-400">正在讀取試算表資料庫...</p>
    </div>

    <!-- Cards Grid (雙切角靈感卡片區) -->
    <section id="cardsGrid" class="grid grid-cols-1 lg:grid-cols-2 gap-5 hidden">
      <!-- 卡片由 JavaScript 動態渲染 -->
    </section>

    <!-- Empty State -->
    <div id="emptyState" class="hidden py-16 text-center">
      <div class="inline-flex p-4 rounded-2xl bg-slate-900 border border-slate-800 text-slate-500 mb-3 text-3xl">
        🔍
      </div>
      <p class="text-sm text-slate-400 font-medium">沒有找到符合條件的靈感議題</p>
      <button onclick="clearFilters()" class="mt-3 text-xs text-amber-400 hover:underline">清除篩選條件</button>
    </div>
  </main>

  <script>
    const SPREADSHEET_ID = '1KU6fOsUmD9tJ2cAcRv9KbuzObNwazRBhXqITz2nfMJc';
    const SHEET_NAME = '社群發想靈感庫';
    const STORAGE_KEY = 'leibo_ideas_sheet_cache_v6';

    let ideas = [];
    let currentCategory = 'ALL';
    let currentStatus = 'ALL';
    let searchQuery = '';
    let selectedArticleId = 'ALL'; // 方案 A：當前選中的特定文章 ID

    document.addEventListener('DOMContentLoaded', () => {
      const cached = localStorage.getItem(STORAGE_KEY);
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          ideas = parsed.data || [];
          if (parsed.timestamp) updateSyncTimeDisplay(parsed.timestamp);
          if (ideas.length > 0) {
            hideLoading();
            renderAll();
          }
        } catch (e) {
          console.error('快取解析失敗', e);
        }
      }

      fetchSheetData(ideas.length === 0);
    });

    function fetchSheetData(showLoadingIndicator = false) {
      if (showLoadingIndicator) showLoading();

      const syncIcon = document.getElementById('syncIcon');
      if (syncIcon) syncIcon.classList.add('animate-spin');

      const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}&t=${Date.now()}`;

      fetch(url)
        .then(res => res.text())
        .then(text => {
          const jsonText = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
          const json = JSON.parse(jsonText);
          const rows = json.table.rows;

          if (!rows || rows.length === 0) {
            showToast('試算表內無資料');
            hideLoading();
            return;
          }

          ideas = rows.map((row, index) => {
            const getVal = (colIndex) => {
              if (!row.c || !row.c[colIndex]) return '';
              const cell = row.c[colIndex];
              return (cell.f || cell.v !== null ? String(cell.v || cell.f) : '').trim();
            };

            const id = getVal(0) || String(index + 1);
            let dateVal = getVal(1);
            if (dateVal.startsWith('Date(')) {
              const parts = dateVal.match(/\d+/g);
              if (parts && parts.length >= 3) {
                const y = parts[0];
                const m = String(Number(parts[1]) + 1).padStart(2, '0');
                const d = String(parts[2]).padStart(2, '0');
                dateVal = `${y}-${m}-${d}`;
              }
            }

            return {
              id: id,
              date: dateVal || '2026-10-28',
              category: getVal(2) || '重大勞資爭議',
              title: getVal(3) || '未命名議題',
              controversy: getVal(4) || '',
              angleA: {
                audience: getVal(5) || '老闆與人資避險視角',
                hook: getVal(6) || '',
                core: getVal(7) || '',
                defense: getVal(8) || '',
                cta: getVal(9) || ''
              },
              angleB: {
                audience: getVal(10) || '職場與社群視角',
                hook: getVal(11) || '',
                core: getVal(12) || '',
                defense: getVal(13) || '',
                cta: getVal(14) || ''
              },
              status: getVal(15) || '可發布',
              note: getVal(16) || ''
            };
          });

          persistLocal();
          hideLoading();
          renderAll();
          showToast(`已載入試算表最新 ${ideas.length} 則靈感！`);
        })
        .catch(err => {
          console.error('讀取試算表失敗：', err);
          hideLoading();
          if (ideas.length === 0) {
            showToast('試算表讀取失敗，請確認共用權限為「知道連結者皆可查看」');
          } else {
            showToast('雲端讀取異常，已維持本機快取');
          }
        })
        .finally(() => {
          if (syncIcon) syncIcon.classList.remove('animate-spin');
        });
    }

    function persistLocal() {
      const nowStr = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        data: ideas,
        timestamp: nowStr
      }));
      updateSyncTimeDisplay(nowStr);
      renderMetrics();
    }

    function showLoading() {
      document.getElementById('loadingState').classList.remove('hidden');
      document.getElementById('cardsGrid').classList.add('hidden');
      document.getElementById('emptyState').classList.add('hidden');
    }

    function hideLoading() {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('cardsGrid').classList.remove('hidden');
    }

    function updateSyncTimeDisplay(timeStr) {
      const el = document.getElementById('lastSyncTime');
      if (el) {
        el.textContent = `同步時間 ${timeStr}`;
        el.classList.remove('hidden');
      }
    }

    // 核心資料漏斗過濾計算
    function getFilteredIdeas() {
      return ideas.filter(item => {
        if (currentCategory !== 'ALL' && item.category !== currentCategory) return false;
        if (currentStatus !== 'ALL' && item.status !== currentStatus) return false;
        if (searchQuery.trim() !== '') {
          const q = searchQuery.toLowerCase();
          const matchTitle = (item.title || '').toLowerCase().includes(q);
          const matchControversy = (item.controversy || '').toLowerCase().includes(q);
          const matchAHook = (item.angleA?.hook || '').toLowerCase().includes(q);
          const matchACore = (item.angleA?.core || '').toLowerCase().includes(q);
          const matchBHook = (item.angleB?.hook || '').toLowerCase().includes(q);
          const matchBCore = (item.angleB?.core || '').toLowerCase().includes(q);
          if (!matchTitle && !matchControversy && !matchAHook && !matchACore && !matchBHook && !matchBCore) {
            return false;
          }
        }
        return true;
      });
    }

    function renderAll() {
      renderMetrics();
      renderCategoryPills();
      updateArticleDropdown();
      renderCards();
    }

    function renderMetrics() {
      const total = ideas.length;
      const ready = ideas.filter(i => i.status === '可發布').length;
      const published = ideas.filter(i => i.status === '已發FB' || i.status === '已發Threads').length;
      const draft = ideas.filter(i => i.status === '待修改').length;

      document.getElementById('metricTotal').textContent = total;
      document.getElementById('metricReady').textContent = ready;
      document.getElementById('metricPublished').textContent = published;
      document.getElementById('metricDraft').textContent = draft;
    }

    function renderCategoryPills() {
      const container = document.getElementById('categoryPills');
      const categories = ['ALL', ...new Set(ideas.map(i => i.category).filter(Boolean))];

      container.innerHTML = categories.map(cat => {
        const isActive = cat === currentCategory;
        const label = cat === 'ALL' ? '全部議題' : cat;
        const activeClass = "cat-pill active px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap border transition bg-amber-500 border-amber-500 text-slate-950 shadow-sm";
        const inactiveClass = "cat-pill px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap border border-slate-800 bg-slate-950 text-slate-300 hover:border-slate-700 transition";

        return `
          <button onclick="handleCategoryFilter('${cat}')" data-cat="${cat}" class="${isActive ? activeClass : inactiveClass}">
            ${label}
          </button>
        `;
      }).join('');
    }

    // 更新「文章快速選取下拉選單」的選項（與篩選器完全連動）
    function updateArticleDropdown() {
      const dropdown = document.getElementById('articleSelect');
      const countBadge = document.getElementById('articleCountBadge');
      const resetBtn = document.getElementById('resetFocusBtn');
      const pool = getFilteredIdeas();

      countBadge.textContent = `共 ${pool.length} 則`;

      // 檢查若選中的 ID 不在過濾後的清單中，自動復原為 ALL
      if (selectedArticleId !== 'ALL' && !pool.some(i => String(i.id) === String(selectedArticleId))) {
        selectedArticleId = 'ALL';
      }

      resetBtn.classList.toggle('hidden', selectedArticleId === 'ALL');

      let optionsHtml = `<option value="ALL">📋 顯示當前全部文章清單 (${pool.length}則)</option>`;
      pool.forEach(item => {
        const isSelected = String(item.id) === String(selectedArticleId);
        optionsHtml += `<option value="${item.id}" ${isSelected ? 'selected' : ''}>[${item.date}] ${item.title}</option>`;
      });

      dropdown.innerHTML = optionsHtml;
    }

    function renderCards() {
      const grid = document.getElementById('cardsGrid');
      const emptyState = document.getElementById('emptyState');
      const pool = getFilteredIdeas();

      if (pool.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      // 判斷是否處於單篇專注模式
      const isFocusMode = selectedArticleId !== 'ALL';
      let displayItems = pool;

      if (isFocusMode) {
        const focusItem = pool.find(i => String(i.id) === String(selectedArticleId));
        displayItems = focusItem ? [focusItem] : pool;
        grid.className = "grid grid-cols-1 gap-5 max-w-3xl mx-auto"; // 單篇專注時版面置中放大
      } else {
        grid.className = "grid grid-cols-1 lg:grid-cols-2 gap-5";
      }

      grid.innerHTML = displayItems.map((item, idx) => {
        let statusBadge = 'bg-slate-800 text-slate-300 border-slate-700';
        if (item.status === '可發布') statusBadge = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
        else if (item.status === '待修改') statusBadge = 'bg-amber-500/10 text-amber-400 border-amber-500/30';
        else if (item.status === '已發FB') statusBadge = 'bg-blue-500/10 text-blue-400 border-blue-500/30';
        else if (item.status === '已發Threads') statusBadge = 'bg-purple-500/10 text-purple-400 border-purple-500/30';

        // 專注模式下的前一篇/下一篇邏輯
        let focusNavHtml = '';
        if (isFocusMode) {
          const currentIndex = pool.findIndex(i => String(i.id) === String(item.id));
          const prevItem = currentIndex > 0 ? pool[currentIndex - 1] : null;
          const nextItem = currentIndex < pool.length - 1 ? pool[currentIndex + 1] : null;

          focusNavHtml = `
            <div class="mb-4 pb-3 border-b border-slate-800 flex items-center justify-between text-xs text-slate-400">
              <button onclick="handleArticleSelect('${prevItem ? prevItem.id : ''}')" ${!prevItem ? 'disabled' : ''} class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 disabled:opacity-30 disabled:pointer-events-none transition flex items-center gap-1 text-slate-200">
                ← 上一篇
              </button>
              <span class="font-mono text-amber-400 font-semibold">第 ${currentIndex + 1} / ${pool.length} 篇</span>
              <button onclick="handleArticleSelect('${nextItem ? nextItem.id : ''}')" ${!nextItem ? 'disabled' : ''} class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 disabled:opacity-30 disabled:pointer-events-none transition flex items-center gap-1 text-slate-200">
                下一篇 →
              </button>
            </div>
          `;
        }

        return `
          <article class="bg-slate-900 border ${isFocusMode ? 'border-amber-500/50 shadow-2xl shadow-amber-500/5' : 'border-slate-800 hover:border-slate-700'} rounded-3xl p-5 sm:p-6 shadow-lg flex flex-col justify-between transition-all duration-200">
            <div>
              ${focusNavHtml}

              <!-- 頂部 Meta 資訊 -->
              <div class="flex items-center justify-between gap-2 mb-3">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-semibold px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 border border-slate-700/80">
                    ${item.category}
                  </span>
                  <span class="text-xs text-slate-500 font-mono">${item.date}</span>
                </div>
                
                <span class="text-xs font-medium rounded-lg px-2.5 py-1 border ${statusBadge}">
                  ${item.status}
                </span>
              </div>

              <!-- 議題標題 -->
              <h2 class="text-base sm:text-xl font-bold text-white mb-2 leading-snug hover:text-amber-400 transition">
                ${item.title}
              </h2>

              <!-- 時事與法令爭點全文 -->
              ${item.controversy ? `
                <div class="bg-slate-950/70 border border-slate-800/80 rounded-2xl p-3 mb-4 space-y-1">
                  <div class="flex items-center gap-1.5 text-xs font-semibold text-amber-400">
                    <span>⚖️</span>
                    <span>時事與法令爭點</span>
                  </div>
                  <p class="text-xs text-slate-300 leading-relaxed">${item.controversy}</p>
                </div>
              ` : ''}

              <!-- 雙切角靈感區 -->
              <div class="space-y-3.5 mb-4">
                <!-- 切角 A (老闆/人資避險) -->
                <div class="bg-blue-950/30 border border-blue-900/40 rounded-2xl p-3.5 sm:p-4 relative group">
                  <div class="flex items-center justify-between mb-1.5">
                    <span class="text-[11px] font-bold text-blue-400 flex items-center gap-1">
                      <span>🛡️</span> 切角 A：${item.angleA?.audience || '老闆/人資避險'}
                    </span>
                    <button onclick="copyText('${escapeQuotes(item.angleA?.hook || '')}', '已複製切角 A 破題 Hook！')" class="text-[10px] text-blue-300 hover:text-white bg-blue-900/60 hover:bg-blue-800 px-2.5 py-1 rounded-md transition font-medium">
                      複製 Hook
                    </button>
                  </div>
                  <div class="text-xs sm:text-sm font-semibold text-blue-100 mb-1 leading-snug">
                    ${item.angleA?.hook || ''}
                  </div>
                  <div class="text-xs text-slate-300/90 leading-relaxed mb-2.5">
                    ${item.angleA?.core || ''}
                  </div>
                  ${item.angleA?.defense ? `
                    <div class="text-[11px] text-emerald-400/90 bg-slate-950/60 p-2.5 rounded-xl mb-1.5 border border-slate-800/50 leading-relaxed">
                      <span class="font-bold">🛡️ 防禦SOP：</span>${item.angleA?.defense}
                    </div>
                  ` : ''}
                  ${item.angleA?.cta ? `
                    <div class="text-[11px] text-slate-400">
                      <span class="text-slate-500 font-semibold">📣 互動CTA：</span>${item.angleA?.cta}
                    </div>
                  ` : ''}
                </div>

                <!-- 切角 B (上班族/Threads熱議) -->
                <div class="bg-amber-950/30 border border-amber-900/40 rounded-2xl p-3.5 sm:p-4 relative group">
                  <div class="flex items-center justify-between mb-1.5">
                    <span class="text-[11px] font-bold text-amber-400 flex items-center gap-1">
                      <span>🔥</span> 切角 B：${item.angleB?.audience || '上班族/Threads熱議'}
                    </span>
                    <button onclick="copyText('${escapeQuotes(item.angleB?.hook || '')}', '已複製切角 B 破題 Hook！')" class="text-[10px] text-amber-300 hover:text-white bg-amber-900/60 hover:bg-amber-800 px-2.5 py-1 rounded-md transition font-medium">
                      複製 Hook
                    </button>
                  </div>
                  <div class="text-xs sm:text-sm font-semibold text-amber-100 mb-1 leading-snug">
                    ${item.angleB?.hook || ''}
                  </div>
                  <div class="text-xs text-slate-300/90 leading-relaxed mb-2.5">
                    ${item.angleB?.core || ''}
                  </div>
                  ${item.angleB?.defense ? `
                    <div class="text-[11px] text-amber-300/90 bg-slate-950/60 p-2.5 rounded-xl mb-1.5 border border-slate-800/50 leading-relaxed">
                      <span class="font-bold">🛡️ 自保SOP：</span>${item.angleB?.defense}
                    </div>
                  ` : ''}
                  ${item.angleB?.cta ? `
                    <div class="text-[11px] text-slate-400">
                      <span class="text-slate-500 font-semibold">📣 互動CTA：</span>${item.angleB?.cta}
                    </div>
                  ` : ''}
                </div>
              </div>

              ${item.note ? `
                <div class="text-[11px] text-slate-400 mb-4 flex items-center gap-1">
                  <span class="text-slate-500">📝 筆記：</span>
                  <span>${item.note}</span>
                </div>
              ` : ''}
            </div>

            <!-- 卡片操作區 -->
            <div class="pt-3.5 border-t border-slate-800/80 flex items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <span class="text-[11px] text-slate-500 font-mono">#${item.id}</span>
                ${!isFocusMode ? `
                  <button onclick="handleArticleSelect('${item.id}')" class="text-xs text-slate-400 hover:text-amber-400 px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 transition">
                    專注閱讀
                  </button>
                ` : ''}
              </div>

              <button onclick="copyFullTopic('${item.id}')" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-400 text-xs font-semibold border border-slate-700 transition shadow-sm">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"/></svg>
                一鍵全選複製
              </button>
            </div>
          </article>
        `;
      }).join('');
    }

    // 下拉選單選擇特定文章處理
    function handleArticleSelect(id) {
      selectedArticleId = id;
      updateArticleDropdown();
      renderCards();
      // 切換後平滑滾動至卡片區域頂部
      window.scrollTo({ top: 180, behavior: 'smooth' });
    }

    function resetFocusMode() {
      handleArticleSelect('ALL');
    }

    // 篩選與搜尋（切換時保留在漏斗中）
    function handleCategoryFilter(cat) {
      currentCategory = cat;
      renderCategoryPills();
      updateArticleDropdown();
      renderCards();
    }

    function handleStatusFilter(status) {
      currentStatus = status;
      updateArticleDropdown();
      renderCards();
    }

    function handleSearch(val) {
      searchQuery = val;
      updateArticleDropdown();
      renderCards();
    }

    function clearFilters() {
      searchQuery = '';
      currentCategory = 'ALL';
      currentStatus = 'ALL';
      selectedArticleId = 'ALL';
      document.getElementById('searchInput').value = '';
      document.getElementById('statusFilter').value = 'ALL';
      handleCategoryFilter('ALL');
    }

    function copyFullTopic(id) {
      const item = ideas.find(i => String(i.id) === String(id));
      if (!item) return;

      const fullText = `【${item.title}】
📅 日期：${item.date}｜分類：${item.category}
⚖️ 時事爭點：${item.controversy || '無'}

---
🛡️【切角 A：${item.angleA?.audience || '老闆/人資避險'}】
破題：${item.angleA?.hook || ''}
觀點：${item.angleA?.core || ''}
SOP：${item.angleA?.defense || ''}
CTA：${item.angleA?.cta || ''}

🔥【切角 B：${item.angleB?.audience || '上班族/Threads熱議'}】
破題：${item.angleB?.hook || ''}
觀點：${item.angleB?.core || ''}
SOP：${item.angleB?.defense || ''}
CTA：${item.angleB?.cta || ''}
---
📝 備註：${item.note || '無'}
（來自：磊伯勞資充電站 ⚡ 社群發想靈感庫）`;

      copyText(fullText, '已複製整則靈感文案到剪貼簿！');
    }

    function copyText(text, msg) {
      if (!navigator.clipboard) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast(msg || '已複製至剪貼簿！');
        return;
      }
      navigator.clipboard.writeText(text).then(() => {
        showToast(msg || '已複製至剪貼簿！');
      }).catch(() => {
        showToast('複製失敗，請手動複製');
      });
    }

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = msg;
      toast.classList.remove('translate-y-[-120%]', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-[-120%]', 'opacity-0');
      }, 2400);
    }

    function escapeQuotes(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, ' ');
    }

    function exportJSONBackup() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(ideas, null, 2));
      const downloadAnchor = document.createElement('a');
      const today = new Date().toISOString().split('T')[0];
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `leibo_ideas_sheet_${today}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast('已成功下載試算表備份 JSON！');
    }
  </script>
</body>
</html>
